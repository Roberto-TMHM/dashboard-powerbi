<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Rotator Dashboard</title>

  <!-- Tailwind for quick styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- jQuery (for simplicity and smooth transitions) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* hidden until fade in */
    }
  </style>
</head>
<body class="flex items-center justify-center">

  <iframe id="displayFrame"></iframe>

  <script>
    // === CONFIGURATION ===
    const urls = [
      "https://app.powerbi.com/links/usv5Lv9-mV?ctid=db05d5da-999e-4104-b58d-018ef611fa8b&pbi_source=linkShare&bookmarkGuid=a8dffa7b-951c-47c5-a349-9b1f2de33ad2",
      "https://app.powerbi.com/links/FprSOa9Odl?ctid=db05d5da-999e-4104-b58d-018ef611fa8b&pbi_source=linkShare"
    ];
	
	const minuteInEachPage = 1;
    const rotationInterval = minuteInEachPage * 60 * 1000; // 1 minute (in milliseconds)
    let currentIndex = 0;

    const $frame = $("#displayFrame");

    function showNextUrl() {
      const nextUrl = urls[currentIndex];
      console.log(`Loading: ${nextUrl}`);

      // Fade out current frame, change URL, fade in new one
      $frame.fadeOut(1000, function() {
        $frame.attr("src", nextUrl);
        $frame.on("load", function() {
          $frame.fadeIn(1000);
          $frame.off("load"); // remove load handler to prevent stacking
        });
      });

      // Go to next URL (loop back to start)
      currentIndex = (currentIndex + 1) % urls.length;
    }

    // Start rotation
    $(document).ready(function() {
      showNextUrl(); // load first one immediately
      setInterval(showNextUrl, rotationInterval);
    });
  </script>

</body>
</html>
